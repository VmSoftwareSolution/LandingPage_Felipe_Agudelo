<section class="reference-section" id="testimonios">

  <button class="nav-btn nav-left" (click)="onNavClick('prev')">&#8592;</button>
  <button class="nav-btn nav-right" (click)="onNavClick('next')">&#8594;</button>

  <h2 class="section-title">Lo Que Dicen de Mí.</h2>

  <div class="h-line-full"></div>

  <div class="carousel-outer">
    <div
      class="carousel-track"
      #track
      [class.is-dragging]="isDragging"
      (mousedown)="startDrag($event)"
      (touchstart)="startTouchDrag($event)"
      (touchmove)="onTouchDrag($event)"
      (touchend)="endTouchDrag($event)"
    >
      <div class="carousel-page" *ngFor="let pair of pairs">

        <div class="testimonial-item">
          <div class="author-col">
            <div class="v-line"></div>
            <img [src]="pair.first.image" [alt]="pair.first.name" class="author-img" />
          </div>
          <div class="content">
            <p class="quote">{{ pair.first.comment }}</p>
            <div class="author-name">{{ pair.first.name | uppercase }}</div>
            <div class="author-role">{{ pair.first.role }}</div>
          </div>
        </div>

        <div class="testimonial-item" *ngIf="pair.second">
          <div class="author-col">
            <div class="v-line"></div>
            <img [src]="pair.second.image" [alt]="pair.second.name" class="author-img" />
          </div>
          <div class="content">
            <p class="quote">{{ pair.second.comment }}</p>
            <div class="author-name">{{ pair.second.name | uppercase }}</div>
            <div class="author-role">{{ pair.second.role }}</div>
          </div>
        </div>

      </div>
    </div>
  </div>

</section>
